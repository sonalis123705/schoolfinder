<div class="login-page">

  <div class="login-card">

<div class="logo">
  School<span>Finder</span>
</div>

<h1>Welcome Back</h1>

<p class="subtitle">
  Login to your SchoolFinder account
</p>


<form (ngSubmit)="login()">

  <!-- Email -->
  <div class="form-group">

    <label>Email</label>

    <input
      type="email"
      name="email"
      [(ngModel)]="email"
      placeholder="Enter your email"
      required
    >

  </div>


  <!-- Password -->
  <div class="form-group">

    <label>Password</label>

    <input
      type="password"
      name="password"
      [(ngModel)]="password"
      placeholder="Enter your password"
      required
    >

  </div>


  <!-- Success -->
  @if (message) {

    <p class="success-message">
      {{ message }}
    </p>

  }


  <!-- Error -->
  @if (errorMessage) {

    <p class="error-message">
      {{ errorMessage }}
    </p>

  }


  <button
    type="submit"
    class="login-submit">

    Login

  </button>

</form>


<p class="register-text">

  Don't have an account?

  <a routerLink="/register">
    Register
  </a>

</p>


  </div>

</div>
