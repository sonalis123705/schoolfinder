<div class="register-page">

  <div class="register-card">


<h1>Create Account</h1>

<p class="subtitle">
  Create your SchoolFinder account
</p>


<form (ngSubmit)="register()">

  <!-- Name -->
  <div class="form-group">

    <label>Name</label>

    <input
      type="text"
      name="name"
      [(ngModel)]="name"
      placeholder="Enter your name"
      required
    >

  </div>


  <!-- Email -->
  <div class="form-group">

    <label>Email</label>

    <input
      type="email"
      name="email"
      [(ngModel)]="email"
      placeholder="Enter your email"
      required
    >

  </div>


  <!-- Password -->
  <div class="form-group">

    <label>Password</label>

    <input
      type="password"
      name="password"
      [(ngModel)]="password"
      placeholder="Enter your password"
      required
    >

  </div>


  <!-- Success message -->
  @if (message) {

    <p class="success-message">
      {{ message }}
    </p>

  }


  <!-- Error message -->
  @if (errorMessage) {

    <p class="error-message">
      {{ errorMessage }}
    </p>

  }


  <button
    type="submit"
    class="register-btn">

    Register

  </button>

</form>


<p class="login-text">

  Already have an account?

  <a routerLink="/login">
    Login
  </a>

</p>


  </div>

</div>
